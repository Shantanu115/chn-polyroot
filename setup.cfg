[pycodestyle]
max-line-length = 88

# build_notebook.py holds the notebook's markdown and code cells as top-level
# string literals. Indenting them to satisfy E122 would indent the notebook
# content itself, so continuation-line indentation is not enforced there.
exclude = build_notebook.py

[flake8]
max-line-length = 88
per-file-ignores =
    build_notebook.py: E122,E501
